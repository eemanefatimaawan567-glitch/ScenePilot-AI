kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "python -m http.server 8080"

[services.production]

[services.production.build]
args = ["python", "-m", "compileall", "."]

[services.production.run]
args = [
  "python",
  "-c",
  "from http.server import BaseHTTPRequestHandler,HTTPServer; H=type('H',(BaseHTTPRequestHandler,),{'do_GET':lambda s:(s.send_response(200),s.end_headers(),s.wfile.write(b'OK'))}); HTTPServer(('0.0.0.0',8080),H).serve_forever()"
]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api"
